framework:
    rate_limiter:
        # POST /api/register : 5 requetes / minute / IP
        register:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # POST /api/verify-email/resend : evite le spam d'emails
        verification_resend:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # POST /api/memberships : 5 demandes d'inscription / 10 minutes / IP
        membership:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # POST /api/contact : 5 messages / 10 minutes / IP
        contact:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # POST /api/articles/{slug}/comments : 5 commentaires / 10 minutes / membre
        comment:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # POST /api/me/messages : 10 messages / heure / membre (anti-spam de la messagerie du club)
        member_message:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
