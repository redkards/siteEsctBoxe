# Documentation de l'API (OpenAPI 3) : bundle chargé en dev uniquement (voir config/bundles.php),
# jamais exposé en production. UI : /api/doc — JSON : /api/doc.json
when@dev:
    nelmio_api_doc:
        documentation:
            info:
                title: ESCT Boxe API
                description: API du site du club ESC Boxe Tergnier (club, disciplines, planning, boxeurs, galas, actualités, inscriptions, messagerie).
                version: 2.0.0
            components:
                securitySchemes:
                    Bearer:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
            security:
                - Bearer: []
        areas:
            default:
                # Toutes les routes /api, sauf la documentation elle-même
                path_patterns:
                    - ^/api(?!/doc(\.json)?$)
