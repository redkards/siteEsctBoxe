<header class="header" [class.header--open]="menuOpen()">
  <div class="bx-container header__bar">
    <app-logo />

    <button
      type="button"
      class="header__burger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-principal"
      (click)="toggleMenu()"
    >
      <span class="bx-sr-only">{{ menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}</span>
      <span class="header__burger-bar" aria-hidden="true"></span>
    </button>

    <div id="menu-principal" class="header__menu" [class.header__menu--open]="menuOpen()">
      <nav class="header__nav" aria-label="Navigation principale">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            ariaCurrentWhenActive="page"
            >{{ link.label }}</a
          >
        }
      </nav>

      <div class="header__actions">
        @if (auth.user(); as user) {
          @if (auth.isStaff()) {
            <a [href]="adminUrl" class="header__admin" rel="noopener">Admin</a>
          }
          <a routerLink="/mon-espace" class="header__user" routerLinkActive="is-active" title="Mon espace">
            <span class="header__avatar" aria-hidden="true">{{ initials(user) }}</span>
            <span class="header__user-name">{{ user.firstName }}</span>
          </a>
          <button type="button" class="header__link-btn" (click)="auth.logout()">Déconnexion</button>
        } @else {
          <a routerLink="/connexion" class="header__login" routerLinkActive="is-active">Connexion</a>
        }
        <a routerLink="/inscription" class="bx-btn bx-btn--primary header__cta">
          S'inscrire <span class="bx-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </div>
</header>
