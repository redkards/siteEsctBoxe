<h2>Gestion des Boxeurs</h2>
<form [formGroup]="boxeurForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Nom:</label>
    <input formControlName="boxeurNom" required />
  </div>
  <div>
    <label>Prénom:</label>
    <input formControlName="boxeurPrenom" required />
  </div>
  <div>
    <label>Poids (kg):</label>
    <input type="number" formControlName="poids" required />
  </div>
  <button type="submit">{{ isEdit ? "Mettre à jour" : "Ajouter" }}</button>
</form>

<h2>Liste des Boxeurs</h2>
<table>
  <thead>
    <tr>
      <th>Nom</th>
      <th>Prénom</th>
      <th>Poids (kg)</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let boxeur of boxeurs">
      <td>{{ boxeur.boxeurNom }}</td>
      <td>{{ boxeur.boxeurPrenom }}</td>
      <td>{{ boxeur.poids }}</td>
      <td>
        <button (click)="editBoxeur(boxeur)">Modifier</button>
        <button (click)="deleteBoxeur(boxeur.id!)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
