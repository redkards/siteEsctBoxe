nelmio_cors:
  # Seules les origines définies dans CORS_ALLOW_ORIGIN (.env.local) peuvent appeler l'API
  defaults:
    origin_regex: true
    allow_origin: ["%env(CORS_ALLOW_ORIGIN)%"]
    allow_headers: ["Content-Type", "Authorization"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    max_age: 3600
  paths:
    "^/api/": ~
