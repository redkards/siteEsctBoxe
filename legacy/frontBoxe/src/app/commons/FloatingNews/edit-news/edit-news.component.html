<p>Edit News</p>

<form (ngSubmit)="updateNews()">
  <label for="newsPictures">Photo</label>
  <input
    type="file"
    id="newsPictures"
    (change)="uploadPicture($event)"
    required
  />
  <input type="hidden" [(ngModel)]="newsPictures" name="newsPictures" />

  <label for="titre">Titre</label>
  <input type="text" id="titre" [(ngModel)]="titre" name="titre" required />

  <label for="newsContent">Contenu</label>
  <textarea
    id="newsContent"
    [(ngModel)]="newsContent"
    name="newsContent"
    required
  ></textarea>

  <label for="publishedAt">Date de publication</label>
  <input
    type="text"
    id="publishedAt"
    [(ngModel)]="news.publishedAt"
    name="publishedAt"
    required
    disabled
  />

  <button type="submit">Modifier</button>

  <!-- Affichage des erreurs éventuelles -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>
</form>
