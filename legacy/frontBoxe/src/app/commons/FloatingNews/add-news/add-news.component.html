<p>add-news works!</p>

<form (ngSubmit)="createNews()" #newsForm="ngForm">
  <label for="newsPictures">Photo</label>
  <input
    type="file"
    id="newsPictures"
    (change)="uploadPicture($event)"
    required
  />

  <label for="titre">Titre</label>
  <input type="text" id="titre" [(ngModel)]="titre" name="titre" required />

  <label for="newsContent">Contenu</label>
  <textarea
    id="newsContent"
    [(ngModel)]="newsContent"
    name="newsContent"
    required
  ></textarea>

  <button type="submit" [disabled]="!newsForm.valid">Créer</button>
</form>
