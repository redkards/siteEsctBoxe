<section>
  <div class="container">
    <div class="sliderContent" [style.transform]="transform">
      <div
        (click)="onSelectMenu('menu1')"
        class="slinderLink menu1 height"
        [ngClass]="getDivClass('menu1')"
        routerLink="/profil"
      >
        <img
          class="imgMenu"
          src="icon/mon-suivi.png"
          alt=""
          [ngClass]="getImgClass('menu1')"
        />
        <span>Mon profil</span>
      </div>
      <div
        (click)="onSelectMenu('menu2')"
        class="slinderLink menu2 height"
        [ngClass]="getDivClass('menu2')"
        routerLink="/messagerie"
      >
        <img
          class="imgMenu"
          src="icon/utilisateur(1).png"
          alt=""
          [ngClass]="getImgClass('menu2')"
        />
        <span>Ma messagerie</span>
      </div>
      <div
        (click)="onSelectMenu('menu3')"
        class="slinderLink menu3 height"
        [ngClass]="getDivClass('menu3')"
        routerLink="/newsMenu"
      >
        <img
          class="imgMenu"
          src="icon/cadenas-black.png"
          alt=""
          [ngClass]="getImgClass('menu3')"
        />
        <span>gestion actualités</span>
      </div>
      <div
        (click)="onSelectMenu('menu4')"
        class="slinderLink menu4 height"
        [ngClass]="getDivClass('menu4')"
        routerLink="/boxeurs"
      >
        <img
          class="imgMenu"
          src="icon/quitter.png"
          alt=""
          [ngClass]="getImgClass('menu4')"
        />
        <span>gestions boxeurs</span>
      </div>
      <div
        (click)="onSelectMenu('menu5')"
        class="slinderLink menu4 height"
        [ngClass]="getDivClass('menu4')"
        routerLink="/deconnexion"
      >
        <img
          class="imgMenu"
          src="icon/quitter.png"
          alt=""
          [ngClass]="getImgClass('menu4')"
        />
        <span>déconnexion</span>
      </div>
    </div>
  </div>
</section>
